<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<body>
  <div id="app-root">

      <svg viewBox="0 0 400 900" width="100%" height="100%" preserveAspectRatio="xMidYMax slice">
        <defs>
          <linearGradient id="bgFade" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" style="stop-color:var(--accent);stop-opacity:0.04"/>
            <stop offset="100%" style="stop-color:var(--accent);stop-opacity:0.16"/>
          </linearGradient>
        </defs>
        <circle cx="40" cy="60" r="1.4" style="fill:var(--text-soft);opacity:0.35"/>
        <circle cx="340" cy="90" r="1.2" style="fill:var(--text-soft);opacity:0.3"/>
        <circle cx="120" cy="40" r="1" style="fill:var(--text-soft);opacity:0.3"/>
        <circle cx="260" cy="120" r="1.6" style="fill:var(--text-soft);opacity:0.3"/>

        <path d="M-20 620 L60 480 L140 560 L210 420 L300 540 L380 460 L440 620 Z" fill="url(#bgFade)"/>
        <path d="M-30 720 L90 560 L190 660 L280 500 L420 660 L420 900 L-30 900 Z" style="fill:var(--accent);opacity:0.10"/>
        <path d="M-30 820 L120 660 L240 760 L340 620 L430 760 L430 900 L-30 900 Z" style="fill:var(--accent);opacity:0.14"/>
      </svg>
    </div>

    <div id="sidebar-slot"></div>

    <div class="app-shell" id="app-shell">
      <div id="header-slot"></div>
      <div id="view-container" class="view-container">
        <div class="loading-screen">Cargando…</div>
      </div>
      <div id="fab-slot"></div>
    </div>

    <div id="menu-slot"></div>
    <div id="modal-slot"></div>
    <div id="toast-slot"></div>
    <div id="confetti-slot"></div>
  </div>

  <script src="js/fonts.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/data.js"></script>
  <script src="js/state.js"></script>
  <script src="js/mountain.js"></script>
  <script src="js/share.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>

</html>
