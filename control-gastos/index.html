<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hucha</title>
<meta name="description" content="Hucha: controla tus ingresos y gastos, ponte una meta diaria y recibe un reconocimiento compartible cada día que la cumplas.">
<meta name="theme-color" content="#0E3B2E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hucha">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app-root">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">🐷</span>
        <span class="brand-name">Hucha</span>
      </div>
      <div id="status-pill" class="status-pill" hidden></div>
    </header>

    <main id="view" class="view" aria-live="polite"></main>

    <nav class="tabbar" id="tabbar">
      <button class="tab-btn" data-tab="hoy" aria-current="page">
        <span class="tab-icon" aria-hidden="true">📅</span><span>Hoy</span>
      </button>
      <button class="tab-btn" data-tab="movimientos">
        <span class="tab-icon" aria-hidden="true">📊</span><span>Movimientos</span>
      </button>
      <button class="tab-btn" data-tab="cuentas">
        <span class="tab-icon" aria-hidden="true">🏦</span><span>Cuentas</span>
      </button>
      <button class="tab-btn" data-tab="metas">
        <span class="tab-icon" aria-hidden="true">🎯</span><span>Metas</span>
      </button>
      <button class="tab-btn" data-tab="consejos">
        <span class="tab-icon" aria-hidden="true">💡</span><span>Consejos</span>
      </button>
      <button class="tab-btn" data-tab="resumen">
        <span class="tab-icon" aria-hidden="true">📈</span><span>Resumen</span>
      </button>
    </nav>

    <div id="modal-slot"></div>
    <div id="toast-slot"></div>
    <div id="confetti-slot"></div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/state.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/share.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
